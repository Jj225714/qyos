<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="same-origin">
    <title>我的 API 用量 · 企业OS</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/portal.css">
    <link rel="stylesheet" href="/my-api-usage.css">
    <script src="/my-api-usage.js" defer></script>
</head>
<body>
    <main class="usage-card" aria-labelledby="usage-title">
        <a href="/">← 返回员工工作台</a>
        <h1 id="usage-title">我的 API 用量</h1>
        <p id="usage-state" role="status" aria-live="polite">正在检查企业登录…</p>
        <section id="usage-details" hidden>
            <p>仅统计通过企业网关、使用已纳入统计的个人 Key 直接调用的记录。聊天、生图和共用 Key 不计入。</p>
            <label>统计周期 <select id="usage-days"><option value="7">最近 7 天</option><option value="30">最近 30 天</option></select></label>
            <dl id="usage-totals" hidden>
                <dt>请求次数</dt><dd id="usage-requests"></dd>
                <dt>输入 Token</dt><dd id="usage-input_tokens"></dd>
                <dt>输出 Token</dt><dd id="usage-output_tokens"></dd>
                <dt>缓存读取 Token</dt><dd id="usage-cache_read_tokens"></dd>
                <dt>缓存写入 Token</dt><dd id="usage-cache_creation_tokens"></dd>
            </dl>
        </section>
        <noscript><p>请启用 JavaScript 后查看登录状态。</p></noscript>
    </main>
</body>
</html>
