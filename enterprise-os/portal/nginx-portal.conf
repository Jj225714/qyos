# 企业OS 门户：纯静态页面。复制到 /etc/nginx/conf.d/ 后按实际域名和证书路径修改。
server {
    listen 80;
    server_name os.jpmamoru.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name os.jpmamoru.com;

    ssl_certificate     /etc/letsencrypt/live/os.jpmamoru.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/os.jpmamoru.com/privkey.pem;

    root /var/www/qyos-portal;
    index index.html;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 改 config.js 后员工刷新就能看到新入口
    location = /config.js {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
